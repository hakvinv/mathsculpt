<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mathsculpt — attractor explorer</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#080a10;color:#eee;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
#ui{position:fixed;top:24px;left:24px;width:210px;padding:18px;border:1px solid #303746;border-radius:14px;background:rgba(12,16,25,.88);z-index:2;backdrop-filter:blur(12px)}h1{margin:0;font-size:16px;letter-spacing:.14em;text-transform:uppercase}#sub{margin:5px 0 18px;color:#a6adbd;font-size:12px;line-height:1.4}.param{margin:14px 0}.label-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#c3c9d5}input[type=range]{width:100%;margin:8px 0 0;accent-color:#9b8bff}select,button{font:inherit;color:#eef0f6;background:#1c2230;border:1px solid #3b4557;border-radius:7px;padding:7px;width:100%}select{cursor:pointer}button{margin-top:8px;cursor:pointer}button:hover{background:#293345}#status{font-size:12px;line-height:1.4;color:#f7c98a;margin:10px 0 0}#status:empty{display:none}#hint{position:fixed;right:22px;bottom:18px;color:#858d9d;font-size:12px;pointer-events:none}@media(max-width:600px){#ui{top:12px;left:12px;width:175px;padding:12px}h1{font-size:14px}#sub{font-size:11px;margin-bottom:10px}.param{margin:9px 0}#hint{right:12px;bottom:10px;font-size:10px}}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive three-dimensional attractor visualization"></canvas>
<div id="ui">
 <h1>mathsculpt</h1><p id="sub">Drag to rotate · scroll to zoom</p>
 <label for="sel">Attractor</label>
 <select id="sel"><option value="lorenz">Lorenz</option><option value="rossler">Rössler</option><option value="halvorsen">Halvorsen</option></select>
 <div class="param" id="row1"><div class="label-row"><label for="p1" id="p1label">σ (sigma)</label><output id="p1v" for="p1">10</output></div><input type="range" id="p1"></div>
 <div class="param" id="row2"><div class="label-row"><label for="p2" id="p2label">ρ (rho)</label><output id="p2v" for="p2">28</output></div><input type="range" id="p2"></div>
 <div class="param" id="row3"><div class="label-row"><label for="p3" id="p3label">β (beta)</label><output id="p3v" for="p3">2.667</output></div><input type="range" id="p3"></div>
 <label for="cm">Color</label><select id="cm"><option value="plasma">Plasma</option><option value="cool">Cool</option><option value="fire">Fire</option><option value="mono">Monochrome</option></select>
 <button id="reset" type="button">Reset view &amp; parameters</button>
 <p id="status" role="status" aria-live="polite"></p>
</div>
<div id="hint">Drag or touch to rotate</div>
<script>
'use strict';
const PRESETS={
 lorenz:{labels:['σ (sigma)','ρ (rho)','β (beta)'],ranges:[[1,28,.1,10],[1,50,.1,28],[.1,10,.01,2.67]],dt:.005},
 rossler:{labels:['a','b','c'],ranges:[[.05,.5,.01,.2],[.05,1,.01,.2],[2,12,.1,5.7]],dt:.015},
 halvorsen:{labels:['a'],ranges:[[.5,2,.01,1.4]],dt:.005}
};
function derivative(type,x,y,z,a,b,c){
 if(type==='lorenz')return [a*(y-x),x*(b-z)-y,x*y-c*z];
 if(type==='rossler')return [-y-z,x+a*y,b+z*(x-c)];
 return [-a*x-4*y-4*z-y*y,-a*y-4*z-4*x-z*z,-a*z-4*x-4*y-x*x];
}
function simulate(type,a,b,c,count=32000){
 const dt=PRESETS[type].dt, points=new Float32Array(count*3);let x=.1,y=0,z=0;
 for(let i=-800;i<count;i++){
  const k1=derivative(type,x,y,z,a,b,c);
  const k2=derivative(type,x+dt*k1[0]/2,y+dt*k1[1]/2,z+dt*k1[2]/2,a,b,c);
  const k3=derivative(type,x+dt*k2[0]/2,y+dt*k2[1]/2,z+dt*k2[2]/2,a,b,c);
  const k4=derivative(type,x+dt*k3[0],y+dt*k3[1],z+dt*k3[2],a,b,c);
  x+=dt*(k1[0]+2*k2[0]+2*k3[0]+k4[0])/6;y+=dt*(k1[1]+2*k2[1]+2*k3[1]+k4[1])/6;z+=dt*(k1[2]+2*k2[2]+2*k3[2]+k4[2])/6;
  if(!Number.isFinite(x+y+z)||Math.max(Math.abs(x),Math.abs(y),Math.abs(z))>1e6)return null;
  if(i>=0){points[i*3]=x;points[i*3+1]=y;points[i*3+2]=z;}
 }
 return points;
}
function normalize(points){
 let lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];
 for(let i=0;i<points.length;i++){let j=i%3;lo[j]=Math.min(lo[j],points[i]);hi[j]=Math.max(hi[j],points[i]);}
 let span=Math.max(...hi.map((v,i)=>v-lo[i]));if(!Number.isFinite(span)||span<1e-8)return null;
 let result=new Float32Array(points.length);for(let i=0;i<points.length;i++){let j=i%3;result[i]=(points[i]-(hi[j]+lo[j])/2)*1.8/span;}return result;
}
function cmap(t,name){if(name==='cool')return [.2+.2*t,.5+.35*t,1-.3*t];if(name==='fire')return [Math.min(1,.5+t),.12+.65*t,.12+.18*t];if(name==='mono')return [.5+.5*t,.5+.5*t,.5+.5*t];return [.45+.5*t,.18+.45*t,.95-.6*t];}
function main(){
 const canvas=document.getElementById('c'),status=document.getElementById('status'),gl=canvas.getContext('webgl',{antialias:true});
 if(!gl){status.textContent='WebGL is unavailable in this browser. Enable hardware acceleration or try a different browser.';return;}
 function shader(type,source){let s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
 const vs=shader(gl.VERTEX_SHADER,'attribute vec3 p; attribute vec3 k; uniform float ax; uniform float ay; uniform float aspect; uniform float zoom; varying vec3 v; void main(){float cx=cos(ax),sx=sin(ax),cy=cos(ay),sy=sin(ay); vec3 q=vec3(p.x,cx*p.y-sx*p.z,sx*p.y+cx*p.z); q=vec3(cy*q.x+sy*q.z,q.y,-sy*q.x+cy*q.z); gl_Position=vec4(q.x*zoom/max(aspect,1.0),q.y*zoom*min(aspect,1.0),q.z*0.15,1.0); v=k;}');
 const fs=shader(gl.FRAGMENT_SHADER,'precision mediump float; varying vec3 v; void main(){gl_FragColor=vec4(v,0.45);}');
 const program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
 const ap=gl.getAttribLocation(program,'p'),ak=gl.getAttribLocation(program,'k'),ux=gl.getUniformLocation(program,'ax'),uy=gl.getUniformLocation(program,'ay'),ua=gl.getUniformLocation(program,'aspect'),uz=gl.getUniformLocation(program,'zoom');
 const positions=gl.createBuffer(),colors=gl.createBuffer();let count=0,ax=-.32,ay=.25,zoom=.88,auto=true,drag=false,lx=0,ly=0;
 const select=document.getElementById('sel');
 function resize(){let dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);gl.viewport(0,0,canvas.width,canvas.height);}window.addEventListener('resize',resize);resize();
 function preset(){let config=PRESETS[select.value];for(let i=1;i<=3;i++){let row=document.getElementById('row'+i),input=document.getElementById('p'+i),r=config.ranges[i-1];row.hidden=!r;if(r){input.min=r[0];input.max=r[1];input.step=r[2];input.value=r[3];document.getElementById('p'+i+'label').textContent=config.labels[i-1];}}rebuild();}
 function rebuild(){let v=[1,2,3].map(i=>Number(document.getElementById('p'+i).value));for(let i=1;i<=3;i++)document.getElementById('p'+i+'v').textContent=v[i-1].toFixed(2).replace(/\.?0+$/,'');let points=simulate(select.value,...v),normal=points&&normalize(points);if(!normal){count=0;status.textContent='This parameter combination diverges or settles to a point. Adjust the sliders or reset.';return;}status.textContent='';count=normal.length/3;let cols=new Float32Array(normal.length),palette=document.getElementById('cm').value;for(let i=0;i<count;i++)cols.set(cmap(i/count,palette),i*3);gl.bindBuffer(gl.ARRAY_BUFFER,positions);gl.bufferData(gl.ARRAY_BUFFER,normal,gl.STATIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,colors);gl.bufferData(gl.ARRAY_BUFFER,cols,gl.STATIC_DRAW);}
 select.addEventListener('change',preset);for(let i=1;i<=3;i++)document.getElementById('p'+i).addEventListener('input',rebuild);document.getElementById('cm').addEventListener('change',rebuild);document.getElementById('reset').addEventListener('click',()=>{ax=-.32;ay=.25;zoom=.88;auto=true;preset();});
 canvas.addEventListener('pointerdown',e=>{drag=true;auto=false;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointerup',()=>{drag=false;});canvas.addEventListener('pointercancel',()=>{drag=false;});canvas.addEventListener('pointermove',e=>{if(!drag)return;ay+=(e.clientX-lx)*.008;ax+=(e.clientY-ly)*.008;lx=e.clientX;ly=e.clientY;});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.25,Math.min(2.2,zoom*Math.exp(-e.deltaY*.001)));},{passive:false});
 gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.clearColor(.03,.04,.06,1);preset();let last=0;
 function frame(t){requestAnimationFrame(frame);if(auto&&last)ay+=(t-last)*.00015;last=t;gl.clear(gl.COLOR_BUFFER_BIT);if(!count)return;gl.uniform1f(ux,ax);gl.uniform1f(uy,ay);gl.uniform1f(ua,canvas.width/canvas.height);gl.uniform1f(uz,zoom);gl.bindBuffer(gl.ARRAY_BUFFER,positions);gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,colors);gl.enableVertexAttribArray(ak);gl.vertexAttribPointer(ak,3,gl.FLOAT,false,0,0);gl.drawArrays(gl.LINE_STRIP,0,count);}requestAnimationFrame(frame);
}
try{main();}catch(e){console.error(e);document.getElementById('status').textContent='The visualization could not start. Try reloading or another browser.';}
</script>
</body>
</html>
